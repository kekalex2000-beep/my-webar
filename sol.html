<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Планеты земной группы</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Arial', sans-serif;
      }
      .info {
        position: fixed;
        bottom: 30px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        color: white;
        padding: 15px 25px;
        border-radius: 50px;
        text-align: center;
        font-size: 16px;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        z-index: 9999;
        max-width: 400px;
        margin: 0 auto;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
      <a-marker type="barcode" value="2">
        <a-entity rotation="-90 20 0">
          <a-sphere
            radius="0.383"
            src="https://www.solarsystemscope.com/textures/download/2k_mercury.jpg"
            segments-width="64"
            segments-height="64"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.5;"
            ></a-sphere>
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="4">
        <a-entity rotation="-90 20 0">
          <a-sphere
            radius="0.949"
            src="https://assets.science.nasa.gov/dynamicimage/assets/science/cds/3d/resources/image/venus/preview.webp?w=2048"
            segments-width="64"
            segments-height="64"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.5;"
            ></a-sphere>
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="4">
        <a-entity rotation="-90 20 0">
          <a-sphere
            radius="1.0"
            src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
            segments-width="64"
            segments-height="64"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.5;"
            ></a-sphere>
        </a-entity>
      </a-marker>
      <a-marker type="barcode" value="5">
        <a-entity rotation="-90 20 0">
          <a-sphere
            radius="0.532"
            src="https://assets.science.nasa.gov/dynamicimage/assets/science/cds/3d/resources/image/mars/preview.webp?w=2048"
            segments-width="64"
            segments-height="64"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.5;"
            ></a-sphere>
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    <div class="info">
      Наведите камеру на маркер
    </div>
  </body>
</html>
