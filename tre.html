<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>дерево на маркере</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false;" 
      renderer="colorManagement: true; exposure: 1.2;">
      <a-assets>
        <a-asset-item id="tree" src="https://raw.githack.com/kekalex2000-beep/my-webar/main/earth.glb"></a-asset-item>
      </a-assets>
      <a-entity light="type: ambient; color: #BBB; intensity: 2.0;"></a-entity>
      <a-entity light="type: directional; color: #FFF; intensity: 1.5;" position="-1 2 1"></a-entity>
      <a-marker preset="hiro">
        <a-entity 
          gltf-model="#tree" 
          scale="0.2 0.2 0.2" 
          position="0 0 0" 
          rotation="-90 0 0">
        </a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
