<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Земля с освещением</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body>
  <a-scene embedded arjs>
    <a-marker preset="hiro">
      <!-- Добавляем свет прямо к маркеру -->
      <a-light type="directional" intensity="1.5" position="1 2 1"></a-light>
      <a-light type="ambient" intensity="0.8"></a-light>
      
      <!-- Модель Земли (твоя ссылка) -->
      <a-entity 
        gltf-model="url(https://cdn.jsdelivr.net/gh/kekalex2000-beep/my-webar@main/models/Earth.glb)"
        scale="0.5 0.5 0.5"
        position="0 0.5 0"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      ></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
