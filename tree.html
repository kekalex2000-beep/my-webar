<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR NFT: Tree on Image</title>
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      .arjs-loader {
        height: 100%; width: 100%; position: absolute; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center;
      }
      .arjs-loader div { text-align: center; color: white; font-family: sans-serif; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
      <div>Загрузка 3D дерева, подождите...</div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets>
        <a-asset-item id="treeModel" src="https://raw.githack.com/kekalex2000-beep/my-webar/main/tree.glb"></a-asset-item>
      </a-assets>

      <a-nft
        type="nft"
        url="https://raw.githack.com/kekalex2000-beep/my-webar/main/Tree"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5">

        <a-entity
          gltf-model="#treeModel"
          scale="50 50 50"
          position="50 150 -100"
          rotation="-90 0 0">
        </a-entity>

      </a-nft>

      <a-entity light="type: ambient; intensity: 1.8;"></a-entity>
      <a-entity light="type: directional; intensity: 0.8;" position="1 2 1"></a-entity>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Скрываем экран загрузки, когда дескрипторы обработаны
      window.addEventListener('arjs-nft-loaded', () => {
         document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
  </body>
</html>
