<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дерево по картинке</title>    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .arjs-loader {
        height: 100%; 
        width: 100%; 
        position: absolute; 
        top: 0; 
        left: 0;
        background-color: rgba(0, 0, 0, 0.8); 
        z-index: 9999;
        display: flex; 
        justify-content: center; 
        align-items: center;
      }
      .arjs-loader div { text-align: center; color: white; font-family: sans-serif; font-size: 1.2em; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="arjs-loader">
      <div>Загрузка...</div>
    </div>
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      <a-assets>
        <a-asset-item id="treeModel" src="https://raw.githack.com/kekalex2000-beep/my-webar/main/earth.glb"></a-asset-item>
      </a-assets>

      <a-nft
        type="nft"
        url="https://raw.githack.com/kekalex2000-beep/my-webar/main/Tree"
        smooth="true"
        smoothCount="25"
        smoothTolerance=".01"
        smoothThreshold="10">
        <a-entity
          gltf-model="#treeModel"
          scale="60 60 60"
          position="50 0 120" 
          rotation="-90 0 0">
        </a-entity>
      </a-nft>
      <a-entity light="type: ambient; intensity: 2.5;"></a-entity>
      <a-entity light="type: directional; intensity: 1.2;" position="1 1 1"></a-entity>
      <a-entity camera></a-entity>
    </a-scene>
    <script>
      window.addEventListener('arjs-nft-loaded', () => {
         document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
  </body>
</html>
