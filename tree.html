<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мое AR Дерево</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="treeModel" src="https://raw.githack.com/kekalex2000-beep/my-webar/main/tree.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity 
          gltf-model="#treeModel" 
          scale="0.2 0.2 0.2" 
          position="0 0 0"
          rotation="0 0 0">
        </a-entity>
        
        <a-text value="Moyo derevo!" position="-0.5 1.5 0" align="center" color="green"></a-text>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
