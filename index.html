<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Земля в AR — Реальная 3D модель</title>
    
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
      .info {
        position: fixed; bottom: 30px; left: 20px; right: 20px;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
        color: white; padding: 15px 25px; border-radius: 50px;
        text-align: center; font-size: 16px; z-index: 9999;
      }
    </style>
  </head>

  <body>
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="earthModel" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Earth/glTF-Binary/Earth.glb"></a-asset-item>
      </a-assets>

      <a-marker type="barcode" value="5">
        
        <a-entity position="0 0.5 0">
          
          <a-entity 
            gltf-model="#earthModel" 
            scale="0.005 0.005 0.005" 
            animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear"
          ></a-entity>

        </a-entity>

        <a-text 
          value="Планета Земля" 
          position="0 1.2 0" 
          scale="1.5 1.5 1.5" 
          color="#FFD700" 
          align="center"
        ></a-text>
        
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <div class="info">
      📱 Наведите камеру на QR-код (матричный код) "5"
    </div>
  </body>
</html>
