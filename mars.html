<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Солнечная система AR</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      .info {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
        border-radius: 30px; z-index: 999; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <a-scene embedded arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">
      
      <a-marker type="barcode" value="4">
        <a-entity rotation="-90 0 0">
          <a-sphere
            radius="1.0"
            src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.5;">
          </a-sphere>
        </a-entity>
      </a-marker>

      <a-marker type="barcode" value="5">
        <a-entity rotation="-90 0 0">
          <a-sphere
            radius="1.0"
            src="https://threejs.org/examples/textures/planets/mars_1k_color.jpg"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
            material="shader: standard; metalness: 0.05; roughness: 0.8;">
          </a-sphere>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <div class="info">Наведите камеру на маркер </div>
  </body>
</html>
