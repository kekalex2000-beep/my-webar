<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Солнечная система AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      .info {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
        border-radius: 30px; z-index: 999; pointer-events: none; text-align: center;
      }
    </style>
  </head>
  <body>
    <a-scene 
      embedded 
      arjs="detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
      renderer="colorManagement: true;">

      <a-entity light="type: ambient; intensity: 1.2;"></a-entity>
      <a-entity light="type: directional; intensity: 0.6; position: 1 1 1"></a-entity>
      
      <a-marker type="barcode" value="5">
        <a-entity rotation="-90 0 0">
          <a-sphere
            radius="1.0"
            src="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
            material="shader: standard; metalness: 0.1; roughness: 0.6;">
          </a-sphere>
        </a-entity>
      </a-marker>

      <a-marker type="barcode" value="6">
        <a-entity rotation="-90 0 0">
          <a-sphere
            radius="1.0"
            src="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars_1k_color.jpg"
            position="0 1.0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
            material="shader: standard; metalness: 0.05; roughness: 0.8;">
          </a-sphere>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <div class="info">Наведите камеру на маркер 5 (Земля) или 6 (Марс)</div>
  </body>
</html>
