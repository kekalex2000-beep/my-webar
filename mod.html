<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Наш первый WebAR с 3D-моделью</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
      <a-assets>
        <a-asset-item id="myModel" src="https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity 
          gltf-model="#myModel" 
          scale="0.5 0.5 0.5" 
          position="0 0 0"
          rotation="0 0 0">
        </a-entity>
        
        <a-text value="Моя модель!" position="-0.5 1 0" scale="1 1 1" color="blue"></a-text>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
    <div style="position: fixed; bottom: 20px; left: 20px; background: white; padding: 10px; border-radius: 5px; z-index: 999;">
      Наведи камеру на маркер HIRO
    </div>
  </body>
</html>
