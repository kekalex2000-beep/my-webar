<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR с 3D моделью Земли</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
    <!-- Подключаем компонент для загрузки GLTF/GLB моделей -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        <!-- Вместо примитивов загружаем модель.
             Важно: путь к модели должен быть точным и доступным. 
             GitHub может блокировать загрузку, лучше использовать другой хостинг. -->
        <a-entity 
          gltf-model="url(https://github.com/kekalex2000-beep/my-webar/raw/refs/heads/main/models/Earth.glb)"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
    <div style="position: fixed; bottom: 20px; left: 20px; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 5px;">
      Наведи камеру на маркер HIRO
    </div>
  </body>
</html>
