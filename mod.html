<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR с рабочей 3D моделью</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js"></script>
    <!-- Компонент для загрузки GLTF/GLB моделей -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        <!-- Используем официальную тестовую модель (вращающийся тор с текстурой) 
             Она маленькая, сжатая и гарантированно работает -->
        <a-entity 
          gltf-model="url(https://threejs.org/examples/models/gltf/Flamingo/glTF/Flamingo.gltf)"
          scale="0.05 0.05 0.05"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        ></a-entity>
        
        <!-- Текст для пояснения -->
        <a-text 
          value="Тестовая модель Flamingo" 
          position="-0.5 0.8 0" 
          scale="1.5 1.5 1.5" 
          color="white"
          align="center"
        ></a-text>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
    <div style="position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; z-index: 9999;">
      🦩 Наведи камеру на маркер HIRO → появится розовый фламинго
    </div>
  </body>
</html>
